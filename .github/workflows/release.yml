name: Сборка и публикация обновления

on:
  push:
    tags:
      - "20*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Сборка релиза AFTERDAY
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Сборка архива обновления
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python tools/build_release.py "$RELEASE_VERSION" --notes "Обновление AFTERDAY Server $RELEASE_VERSION"

      - name: Публикация релиза на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "dist/$RELEASE_VERSION/manifesto.json" \
            "dist/$RELEASE_VERSION/atualizacao.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AFTERDAY Server $RELEASE_VERSION" \
            --notes "Автоматически собранное обновление AFTERDAY Server $RELEASE_VERSION." \
            --verify-tag \
            --latest
